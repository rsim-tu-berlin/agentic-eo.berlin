    title: "Panel: Earth Observation in the age of Agentic AI: From Insight to Business"
    speaker: ""
    type: panel
    details: |
      _From data to insight, and from insight to action: The panel will explore how Agentic AI could fundamentally reshape the EO value chain, from sensing and data generation to analysis, decision-making and business impact. Bringing together perspectives from research, EO technology and enterprise, the discussion will examine how AI agents could be a key element of the full data chain, combine EO with diverse sources of knowledge, and transform increasingly rich Earth observations into decision-ready intelligence. With applications ranging from insurance and risk management to emerging EO services and markets, the panel will address the key question: How do we move from technological potential to real-world impact and sustainable business value?_

      ---

      **Moderated by** Chiara Cocchiara, ESA Φ-lab

