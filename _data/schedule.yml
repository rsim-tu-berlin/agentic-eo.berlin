    end: "17:30"
    title: "Thematic Discussion: Subway Takes: Agentic AI Edition"
    speaker: ""
    type: panel
    details: |
      _Join this guided, engaging discussion where participants share and debate strong opinions, concerns, and unpopular takes on Agentic AI for Earth Observation. Come with a take of your own, or respond 
      to one raised by someone else. The goal is not consensus, but a better collective understanding of where agentic approaches genuinely add value in EO._
      ---
      **Moderated by** Eva Gmelich Meijling and Riccardo D'Ercole, ESA Φ-lab
  
