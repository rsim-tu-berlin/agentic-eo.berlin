# ===========================================================================
# Workshop schedule — single source of truth for /programme/schedule/
#
# The page renders TWO views from this file (desktop timetable grid + mobile /
# print agenda list) and lets visitors filter by DAY and by ROOM. To update the
# programme, you only ever edit this file.
#
# There are four sections:
#   1. rooms       — every room, defined once (referenced by events via `room:`)
#   2. days        — every day, defined once (referenced by events via `day:`)
#   3. linked_days — satellite events that link out instead of having a timetable
#   4. events      — the actual schedule; one entry per session
#
# ---------------------------------------------------------------------------
# EVENT FIELDS
#   day:     (required) id of a day from the `days:` list
#   room:    (required) id of a room from the `rooms:` list,
#            OR "plenary" for sessions that occupy the whole venue
#            (registration, breaks, plenary keynotes, receptions...).
#            Plenary events span all room columns and stay visible no matter
#            which room filter is active.
#   start:   (required) "HH:MM", 24h, zero-padded, aligned to 5 minutes
#   end:     (required) "HH:MM"
#   title:   (required)
#   speaker: (optional) plain text, but line breaks are kept. For more than one
#            name, switch from a quoted value to a `|` block:
#
#              speaker: |
#                Chiara Cocchiara
#                Julia Gottfriedsen
#
#            (Not Markdown — `- item` stays a dash. Use `details:` for lists.)
#   type:    (optional) colour/badge: keynote | talk | workshop | hands-on |
#            panel | poster | demo | break
#   details: (optional) longer description. Short sessions get a small tile in
#            the timetable, so this text is not shown there directly: it appears
#            in a pop-up on hover/focus, and inline in the mobile/print agenda.
#            Markdown (links, emphasis, lists) and HTML are supported, and every
#            line break you type is kept — so keep a paragraph on ONE line, or
#            it will be broken up exactly where you wrapped it.
#
# Tip: keep times zero-padded ("09:00", not "9:00") so they sort correctly.
#
# Events are written as one-line flow mappings below. An event with `details`
# needs the block form instead, because the text is too long for one line.
#
# Always write `details: |` — the pipe keeps your line breaks. Do NOT use `>-`:
# it folds every line into one long line, and Markdown then refuses to start a
# list, so `- item` and `<ul>`/`<li>` come out as visible text. (Inline tags
# like <br> and <strong> survive folding, which is why those appear to work.)
#
#   - day: day3
#     room: expertisium
#     start: "14:00"
#     end: "15:30"
#     title: "Track 1: Building and Operating EO Agents"
#     speaker: "Building Agentic Earth Observation Workflows with EVE Workbench"
#     type: workshop
#     details: |
#       We start from a bare STAC catalogue and end with an agent that plans its own queries. See the [hands-on call](/calls/hands-on/).
#
#       Bring a laptop with:
#
#       - Python 3.11
#       - Docker
# ===========================================================================

