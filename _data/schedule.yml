    title: "Oral Session 1: Agentic Decision Intelligence and Earth Action"
    speaker: ""
    type: talk
    details: |
      This session focuses on agents that transform EO observations into actionable decisions. This session illustrates the evolution: from Observation, analysis, prioritization, decision support and Earth Action.
      ---
      15:00 – 15:12 A Decision-Driven Hazard-Agnostic Agentic AI Framework for Earth Observation: Demonstration through a Flood Response Use Case
      Presented by Firoozeh Foroozan and Carlos Pino Padilla, Indra Space
      15:12 – 15:24 Multi-Agent Early Extreme Event Detection From IoT to Earth Observation Tasking
      Presented by Arnaud Le Carvennec and Axel Gruyez, CS Group
      15:24 – 15:36 Wildfire Lifecycle Monitoring from Earth Observation
      Presented by Rishi Madhok and Fuxun Yu, TerraByte
      15:36 – 15:48 Agentic Orchestration of Earth Observation Foundation Models via the Model Context Protocol
      Presented by Pauline Delporte and Marie Leconte and Arnaud Le Carvennec, CS Group, and Nicolas Longépé, ESA Φ-Lab
      15:48 – 16:00 TerraScope: Pixel-Grounded Visual Reasoning for Earth Observation
      Presented by Yan Shu, University of Trento

  - day: day1 
    room: lecture-hall
    start: "16:05"
    end: "16:45"
    title: "Panel:Earth Observation in the age of Agentic AI: From Insight to Business"
    speaker: ""
    type: panel
    details: |
      _From data to insight, and from insight to action: The panel will explore how Agentic AI could fundamentally reshape the EO value chain, from sensing and data generation to analysis, decision-making and 
      business impact. Bringing together perspectives from research, EO technology and enterprise, the discussion will examine how AI agents could be a key element of the full data chain, combine EO with diverse
      sources of knowledge, and transform increasingly rich Earth observations into decision-ready intelligence. With applications ranging from insurance and risk management to emerging EO services and markets,
      the panel will address the key question: How do we move from technological potential to real-world impact and sustainable business value?_
      ---
      **Moderated by** Chiara Cocchiara, ESA Φ-lab

      **Panelists:**

      - **Julia Gottfriedsen** Chief Technical Officer at ConstelIR
      - **Marcin Detyniecki** Group Chief Data Scientist & Head of Research & Advanced AI at AXA
      - **Andres Camero** Co-Head of Department EO Data Science at German Aerospace Center (DLR)
      - **Linda Sheard** VP, Analytics and Agentic Products at Xoople
  - day: day1
