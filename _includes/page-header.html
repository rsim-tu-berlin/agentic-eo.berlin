{% assign bg = page.hero_image | default: site.hero_image %}
<section
  class="hero-banner hero-banner--compact d-flex align-items-center justify-content-center text-center text-white"
  {% if bg %}style="background-image: url('{{ bg | relative_url }}');"{% endif %}
>
  <div class="hero-banner__overlay"></div>
  <div class="container position-relative">
    {% if page.title %}
      <h1 class="display-6 fw-bold mb-0">{{ page.title }}</h1>
    {% endif %}
  </div>
</section>
